# ============================================================
# MAHARASHTRA FLOOD PREDICTION SYSTEM — CONFIGURATION
# ============================================================
# DO NOT commit .env or secrets to version control.
# All API keys must be in .env file.

# ─────────────────────────────────────────
# PROJECT METADATA
# ─────────────────────────────────────────
project:
  name: "Maharashtra Proactive Flood Prediction System"
  version: "0.1.0"
  state: "Maharashtra"
  state_code: 27          # State LGD Code for Maharashtra
  disclaimer: >
    This is a research/decision-support system only.
    It does not replace official government flood warnings
    from IMD, CWC, NDMA, or Maharashtra state authorities.

# ─────────────────────────────────────────
# DATA PATHS
# ─────────────────────────────────────────
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  external_dir: "data/external"
  models_dir: "models"
  reports_dir: "reports/figures"

  rainfall:
    statewise: "data/raw/rainfall/rainfall_statewise_daily_imd.csv"
    districtwise: "data/raw/rainfall/rainfall_districtwise_daily_imd.csv"

  river_discharge:
    cwc_manual: "data/raw/river_discharge/river_discharge_manual_daily_cwc_mh_2026_2030.csv"

  river_level:
    # Will be populated when river water level data is acquired
    cwc_level: "data/raw/river_level/"

  flood_events:
    # Will be populated when historical flood events are acquired
    historical: "data/raw/flood_events/"

  weather:
    # Will be populated when weather data is acquired
    historical: "data/raw/weather/"

  geographic:
    # Will be populated with GeoJSON district boundaries
    districts_geojson: "data/raw/geographic/maharashtra_districts.geojson"
    dem: "data/raw/geographic/maharashtra_dem_30m.tif"

  training_dataset: "data/processed/maharashtra_flood_training_dataset.csv"

# ─────────────────────────────────────────
# MAHARASHTRA FILTER
# ─────────────────────────────────────────
# Always filter by actual data content, never by filename alone
maharashtra:
  state_name_variants:
    - "Maharashtra"
    - "MAHARASHTRA"
  state_lgd_code: 27
  # Reference: 36 districts in districtwise dataset
  expected_districts: 36

# ─────────────────────────────────────────
# RISK LEVEL THRESHOLDS
# ─────────────────────────────────────────
# These are INITIAL visualization thresholds ONLY.
# They are NOT scientifically validated flood probability thresholds.
# They must be recalibrated after model training and evaluation.
risk_thresholds:
  low:
    min: 0.00
    max: 0.30
    color: "#22c55e"   # Green
    label: "LOW"
    emoji: "🟢"

  medium:
    min: 0.30
    max: 0.60
    color: "#eab308"   # Yellow
    label: "MEDIUM"
    emoji: "🟡"

  high:
    min: 0.60
    max: 0.80
    color: "#f97316"   # Orange
    label: "HIGH"
    emoji: "🟠"

  extreme:
    min: 0.80
    max: 1.00
    color: "#ef4444"   # Red
    label: "EXTREME"
    emoji: "🔴"

# ─────────────────────────────────────────
# FORECAST HORIZONS
# ─────────────────────────────────────────
forecast_horizons:
  - 6    # hours
  - 12   # hours
  - 24   # hours

# ─────────────────────────────────────────
# FEATURE ENGINEERING SETTINGS
# ─────────────────────────────────────────
features:
  # Rainfall rolling windows (in days, since data is daily resolution)
  rainfall_windows_days:
    - 1
    - 2
    - 3
    - 7

  # River discharge rolling windows (in days)
  discharge_windows_days:
    - 1
    - 3
    - 7

  # NOTE: Hourly features (rainfall_1h, rainfall_3h, etc.) are UNAVAILABLE
  # because the current data is daily resolution only.
  # These will be enabled when hourly API data is connected.
  hourly_features_available: false

# ─────────────────────────────────────────
# TIME SERIES SPLIT SETTINGS
# ─────────────────────────────────────────
time_series_split:
  # Minimum years required for training
  min_train_years: 2
  # Proportions (adjusted automatically based on actual data range)
  test_fraction: 0.15
  validation_fraction: 0.15
  # No random shuffling — always chronological
  shuffle: false

# ─────────────────────────────────────────
# ML MODEL SETTINGS
# ─────────────────────────────────────────
models:
  # Random seeds for reproducibility
  random_state: 42

  logistic_regression:
    max_iter: 1000
    class_weight: "balanced"

  random_forest:
    n_estimators: 200
    max_depth: 15
    class_weight: "balanced"
    n_jobs: -1

  hist_gradient_boosting:
    max_iter: 300
    learning_rate: 0.05
    class_weight: "balanced"

  xgboost:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    scale_pos_weight: "auto"  # Set automatically from class ratio
    tree_method: "hist"

  # Probability threshold for binary classification
  # 0.5 is default; can be tuned for recall vs precision tradeoff
  # For flood prediction: lower threshold = more sensitive (fewer false negatives)
  default_threshold: 0.5

# ─────────────────────────────────────────
# MAP SETTINGS
# ─────────────────────────────────────────
map:
  # Map center: Maharashtra geographic centroid
  center_lat: 19.7515
  center_lon: 75.7139
  default_zoom: 7
  min_zoom: 6
  max_zoom: 14

  # Auto-refresh interval in minutes
  # NOTE: This is only "live" if connected to a real-time data source
  refresh_interval_minutes: 15

  # Basemap
  tile_provider: "OpenStreetMap"
  tile_url: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
  tile_attribution: "© OpenStreetMap contributors"

  # Layer visibility defaults
  layers:
    predicted_risk_zones: true
    historical_flood_events: false
    rainfall_stations: true
    river_stations: true
    river_discharge: false
    district_boundaries: true
    river_network: false

# ─────────────────────────────────────────
# API SETTINGS
# ─────────────────────────────────────────
api:
  host: "0.0.0.0"
  port: 8000
  debug: true
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:5500"
    - "*"  # Set to specific origins in production

  # Rate limiting (requests per minute)
  rate_limit: 100

# ─────────────────────────────────────────
# DATABASE SETTINGS
# ─────────────────────────────────────────
# Actual values must be in .env file — never hardcode credentials
database:
  # Connection details loaded from .env
  host_env: "DB_HOST"
  port_env: "DB_PORT"
  name_env: "DB_NAME"
  user_env: "DB_USER"
  password_env: "DB_PASSWORD"
  default_port: 5432
  postgis_enabled: true
  # For development without PostgreSQL, use SQLite
  sqlite_fallback: "data/flood_prediction_dev.db"

# ─────────────────────────────────────────
# EXTERNAL API SETTINGS
# ─────────────────────────────────────────
# API keys must be in .env — never in this file
external_apis:
  # Open-Meteo (FREE — no API key required)
  open_meteo:
    base_url: "https://api.open-meteo.com/v1"
    historical_url: "https://archive-api.open-meteo.com/v1/archive"
    variables:
      - "temperature_2m"
      - "relative_humidity_2m"
      - "surface_pressure"
      - "wind_speed_10m"
      - "wind_direction_10m"
      - "precipitation"

  # IMD API — key required
  imd:
    base_url_env: "IMD_API_URL"
    api_key_env: "IMD_API_KEY"
    enabled: false

  # CWC Real-time API — key required
  cwc:
    base_url_env: "CWC_API_URL"
    api_key_env: "CWC_API_KEY"
    enabled: false

# ─────────────────────────────────────────
# ALERT SETTINGS
# ─────────────────────────────────────────
alerts:
  # Minimum risk level to trigger alert
  min_alert_level: "HIGH"
  # Channels (configured via .env)
  email_enabled: false
  sms_enabled: false
  webhook_enabled: false

# ─────────────────────────────────────────
# LOGGING
# ─────────────────────────────────────────
logging:
  level: "INFO"
  format: "%(asctime)s | %(name)s | %(levelname)s | %(message)s"
  file: "logs/flood_prediction.log"
  max_bytes: 10485760  # 10 MB
  backup_count: 5
